name: Deploy

on:
  push:
    branches: [main, develop]
  pull_request:

# A second push to the same branch should supersede an in-flight deploy, not
# race it. Keyed on ref so main and develop never block each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm must be installed before setup-node, or `cache: pnpm` has no
      # store path to resolve. Version comes from package.json packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # --if-present so this is a no-op until the authorization suite lands in
      # Phase 1, rather than a red X on every run until then.
      - run: pnpm run --if-present test

  build:
    name: Build and push image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR rejects uppercase image paths, and github.repository preserves the
      # owner's casing -- so normalise rather than assume.
      - name: Resolve image tag
        id: meta
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # The image is environment-agnostic on purpose: staging and production run the
  # same artifact and differ only in Dokku config (APP_ENV, DATABASE_URL,
  # domain). That is what makes staging a real rehearsal rather than a
  # look-alike. Never bake an environment into the image via NEXT_PUBLIC_*.
  # ---------------------------------------------------------------------------

  deploy-staging:
    name: Deploy to staging
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://portico-staging.frontendjuan.com
    steps:
      - name: Deploy
        env:
          DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
          SSH_KEY: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          IMAGE: ${{ needs.build.outputs.image }}
          DOKKU_APP: portico-staging
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key rather than disabling verification.
          ssh-keyscan -H "$DOKKU_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # `git:from-image` is NOT idempotent: re-deploying an image the app is
          # already on exits 1 with "No changes detected, skipping git commit".
          # That matters, because the first deploy of any new app fails its
          # post-deploy TLS check and has to be re-run -- and a re-run must not
          # be blocked by the deploy step refusing to repeat itself. Dokku's own
          # message names the remedy, so follow it rather than treating a
          # no-op as a failure.
          set +e
          OUT=$(ssh "dokku@$DOKKU_HOST" git:from-image "$DOKKU_APP" "$IMAGE" 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then
            case "$OUT" in
              *"No changes detected"*)
                echo "App is already on this image; rebuilding instead."
                ssh "dokku@$DOKKU_HOST" ps:rebuild "$DOKKU_APP"
                ;;
              *)
                exit "$CODE"
                ;;
            esac
          fi

      - name: Verify staging is not indexable
        env:
          # Optional. Set this secret to "user:password" if the staging app is
          # behind dokku http-auth (recommended -- it is the only layer that
          # actually stops non-compliant AI crawlers). Without it, these checks
          # would just read 401 pages.
          STAGING_BASIC_AUTH: ${{ secrets.STAGING_BASIC_AUTH }}
        run: |
          set -euo pipefail
          URL=https://portico-staging.frontendjuan.com

          # A wrapper rather than an array: empty-array expansion under `set -u`
          # errors on bash < 4.4, and this stays correct on any version.
          fetch() {
            if [ -n "${STAGING_BASIC_AUTH:-}" ]; then
              curl -u "$STAGING_BASIC_AUTH" "$@"
            else
              curl "$@"
            fi
          }
          [ -n "${STAGING_BASIC_AUTH:-}" ] && echo "Using basic auth for staging checks."

          # Give the container a moment to finish the swap. This loop MUST fail
          # loudly when it never succeeds: every check below reads a header out
          # of a response, and an unreachable host produces the same empty
          # string as a misconfigured app. Without this the job blamed APP_ENV
          # for what was actually a TLS handshake failure -- which is exactly
          # how the very first deploy fails, because letsencrypt can only be
          # enabled once a container is already running (checklist section H).
          READY=false
          for i in $(seq 1 30); do
            if fetch -sfo /dev/null "$URL/api/health"; then READY=true; break; fi
            sleep 2
          done
          if [ "$READY" != true ]; then
            echo "FAIL: $URL/api/health never answered after 60s." >&2
            echo "--- curl's own error ---" >&2
            fetch -sS -o /dev/null "$URL/api/health" >&2 || true
            echo "A TLS error here means letsencrypt is not enabled for this app yet." >&2
            echo "A 401 means STAGING_BASIC_AUTH is missing or wrong." >&2
            exit 1
          fi

          echo "--- X-Robots-Tag on / ---"
          HEADER=$(fetch -sSI "$URL/" | tr -d '\r' | grep -i '^x-robots-tag:' || true)
          echo "${HEADER:-<none>}"
          case "$HEADER" in
            *noindex*) echo "OK: staging root is noindex" ;;
            *) echo "FAIL: staging root is missing a noindex X-Robots-Tag." \
                    "Check APP_ENV on the portico-staging app -- it must NOT be 'production'." >&2
               exit 1 ;;
          esac

          echo "--- robots.txt ---"
          BODY=$(fetch -sS "$URL/robots.txt")
          echo "$BODY"
          echo "$BODY" | grep -q 'Disallow: /' \
            || { echo "FAIL: staging robots.txt does not disallow crawling" >&2; exit 1; }

  deploy-production:
    name: Deploy to production
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://portico.frontendjuan.com
    steps:
      - name: Deploy
        env:
          DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
          SSH_KEY: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          IMAGE: ${{ needs.build.outputs.image }}
          DOKKU_APP: portico
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DOKKU_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # `git:from-image` is NOT idempotent: re-deploying an image the app is
          # already on exits 1 with "No changes detected, skipping git commit".
          # That matters, because the first deploy of any new app fails its
          # post-deploy TLS check and has to be re-run -- and a re-run must not
          # be blocked by the deploy step refusing to repeat itself. Dokku's own
          # message names the remedy, so follow it rather than treating a
          # no-op as a failure.
          set +e
          OUT=$(ssh "dokku@$DOKKU_HOST" git:from-image "$DOKKU_APP" "$IMAGE" 2>&1)
          CODE=$?
          set -e
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then
            case "$OUT" in
              *"No changes detected"*)
                echo "App is already on this image; rebuilding instead."
                ssh "dokku@$DOKKU_HOST" ps:rebuild "$DOKKU_APP"
                ;;
              *)
                exit "$CODE"
                ;;
            esac
          fi

      - name: Verify production indexability is correct
        env:
          DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
        run: |
          set -euo pipefail
          URL=https://portico.frontendjuan.com

          # This must fail loudly rather than fall through. The "/ must NOT be
          # noindex" check below reads success from an EMPTY header -- and an
          # unreachable host also produces an empty header. Without this gate a
          # production site that is completely down reports a green deploy on
          # the one check whose whole job is catching silent deindexing.
          READY=false
          for i in $(seq 1 30); do
            if curl -sfo /dev/null "$URL/api/health"; then READY=true; break; fi
            sleep 2
          done
          if [ "$READY" != true ]; then
            echo "FAIL: $URL/api/health never answered after 60s." >&2
            echo "--- curl's own error ---" >&2
            curl -sS -o /dev/null "$URL/api/health" >&2 || true
            echo "A TLS error here means letsencrypt is not enabled for this app yet." >&2
            exit 1
          fi

          # What SHOULD / look like? Ask the app, not a flag duplicated in CI.
          # ALLOW_INDEXING on the Dokku app is the single source of truth that
          # lib/indexing.ts reads at runtime; reading the same variable here
          # means this assertion can never drift out of step with the app's
          # actual behaviour. Anything other than exactly "true" -- including
          # unset -- means we expect the site to be hidden.
          ALLOW=$(ssh "dokku@$DOKKU_HOST" config:get portico ALLOW_INDEXING 2>/dev/null || true)
          echo "ALLOW_INDEXING on portico: '${ALLOW:-<unset>}'"

          echo "--- / ---"
          ROOT=$(curl -sSI "$URL/" | tr -d '\r' | grep -i '^x-robots-tag:' || true)
          echo "${ROOT:-<none>}"

          if [ "$ALLOW" = "true" ]; then
            # Launched. A stray noindex here would quietly deindex the site,
            # which is the failure nobody notices for weeks.
            case "$ROOT" in
              *noindex*) echo "FAIL: production marketing page is noindex, but" \
                              "ALLOW_INDEXING=true says it should be public." \
                              "Check APP_ENV on the portico app." >&2
                         exit 1 ;;
              *) echo "OK: / is indexable, as intended" ;;
            esac
          else
            # Pre-launch. The placeholder must stay out of search results, and
            # this asserts it rather than trusting that it happened.
            case "$ROOT" in
              *noindex*) echo "OK: / is held back from indexing (ALLOW_INDEXING is not 'true')" ;;
              *) echo "FAIL: / is indexable, but ALLOW_INDEXING is not 'true'." \
                      "The placeholder is being exposed to search engines." >&2
                 exit 1 ;;
            esac
          fi

          # The authenticated trees must NOT be indexable.
          echo "--- /app (expect noindex) ---"
          APPH=$(curl -sSI "$URL/app" | tr -d '\r' | grep -i '^x-robots-tag:' || true)
          echo "${APPH:-<none>}"
          case "$APPH" in
            *noindex*) echo "OK: /app is noindex" ;;
            *) echo "FAIL: /app is missing a noindex X-Robots-Tag" >&2; exit 1 ;;
          esac
